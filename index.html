<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bangumi Staff Analyzer · 制作人员分析</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <img class="logo" src="icon.png" alt="logo">
        <div class="brand-text">
          <h1>Staff Analyzer</h1>
          <p>Bangumi 制作人员分析</p>
        </div>
      </div>
      <nav id="nav">
        <a href="#/home" data-route="home">首页 / 搜索</a>
        <a href="#/compare" data-route="compare">对比（作品 / 公司）</a>
        <a href="#/collections" data-route="collections">我的分类收集</a>
      </nav>
      <div class="sidebar-foot">
        <button id="btn-settings" class="linklike" type="button">设置</button>
        <span class="ver">v1.4.2</span>
      </div>
    </aside>
    <main id="main">
      <div id="view"></div>
    </main>
  </div>
  <div id="toast-root"></div>
  <div id="modal-root"></div>

  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views/home.js"></script>
  <script src="js/views/analysis.js"></script>
  <script src="js/views/compare.js"></script>
  <script src="js/views/collections.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
